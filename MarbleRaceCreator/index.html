<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marble Race · The Brain Maze</title>
<link rel="icon" href="assets/brainmaze-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --panel:rgba(255,255,255,.84);--line:rgba(40,50,90,.12);--ink:#232f5c;--muted:#6b7194;
  --accent:#232f5c;--accent2:#f37265;--coral:#f37265;--navy:#232f5c;--ok:#20c997;--bad:#ff4d6d;--shadow:0 10px 30px rgba(35,41,70,.16);--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#cfe9ff;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0}
#app canvas{display:block;touch-action:none;outline:none}
.panel{background:var(--panel);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow);border-radius:var(--r)}
.hidden{display:none!important}

/* top bar */
#topbar{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;pointer-events:none;flex-wrap:wrap;z-index:10}
#topbar>*{pointer-events:auto}
@font-face{font-family:Brain;src:url(assets/Brain.ttf) format("truetype");font-display:swap}
.brand{padding:6px 14px 6px 10px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand img{height:30px;display:block}
.brand .title{font-family:Brain,Outfit,sans-serif;font-size:19px;letter-spacing:.04em;color:var(--coral);line-height:1;padding-left:10px;border-left:1.5px solid var(--line)}
.brand .title span{color:var(--navy)}
.brand small{font-family:Outfit,system-ui,sans-serif;font-weight:500;color:var(--muted);font-size:13px;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.logo{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 30deg,#ff6b9a,#ffd43b,#38d9a9,#4dabf7,#9775fa,#ff6b9a);box-shadow:inset -4px -5px 8px rgba(0,0,0,.22),inset 3px 3px 6px rgba(255,255,255,.75)}
.bar{display:flex;align-items:center;gap:4px;padding:5px}
.spacer{flex:1}
button.b{border:0;background:transparent;height:34px;min-width:34px;padding:0 10px;border-radius:10px;font:inherit;font-weight:600;font-size:14px;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:background .15s,color .15s,transform .1s;white-space:nowrap}
button.b:hover{background:rgba(243,114,101,.1)}
button.b:active{transform:scale(.96)}
button.b.on{background:var(--accent);color:#fff}
button.b.icon{padding:0}
button.primary{background:linear-gradient(135deg,#f37265,#e5574a)!important;color:#fff!important;box-shadow:0 4px 14px rgba(243,114,101,.4);padding:0 16px;font-family:Brain,Outfit,sans-serif;font-weight:400;letter-spacing:.04em;font-size:15px}
button.primary:hover{filter:brightness(1.06)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.stepper{display:flex;align-items:center;gap:2px;font-weight:700;font-size:14px}
.stepper span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.stepper label{font-weight:500;color:var(--muted);font-size:13px;margin-left:2px}
.speed{display:flex;align-items:center;gap:8px;padding:0 6px;font-size:13px;color:var(--muted)}
.speed b{color:var(--ink);min-width:38px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:96px;height:6px;border-radius:6px;background:linear-gradient(90deg,#c3c9dd,#f8b3ab);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer}
.seg{display:flex;background:rgba(243,114,101,.08);border-radius:11px;padding:2px}
.seg button.b{height:30px;font-size:13px}

/* palette */
#palette{position:fixed;left:12px;top:var(--top,72px);bottom:12px;width:208px;overflow:auto;padding:8px 10px 10px;z-index:5}
#palette::-webkit-scrollbar{width:6px}#palette::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:6px}
.cat h4{margin:10px 4px 6px;font-family:Brain,Outfit,sans-serif;font-weight:400;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{background:#fff;border:1.5px solid transparent;border-radius:12px;padding:3px 3px 6px;text-align:center;cursor:grab;transition:transform .15s,border-color .15s,box-shadow .15s;touch-action:none;box-shadow:0 1px 3px rgba(35,41,70,.08)}
.card img{width:100%;aspect-ratio:1;display:block;pointer-events:none;border-radius:9px;background:linear-gradient(180deg,#f5f7ff,#fff)}
.card span{display:block;font-size:12px;font-weight:600;line-height:1.1;margin-top:2px}
.card:hover{transform:translateY(-2px);border-color:#f8b3ab;box-shadow:0 6px 16px rgba(243,114,101,.18)}
.card.active{border-color:var(--coral);background:#fff1ef}
.pal-foot{font-size:11.5px;color:var(--muted);margin:10px 4px 0;line-height:1.45}

/* race panel */
#racePanel{position:fixed;right:12px;top:var(--top,72px);width:252px;padding:14px 12px 10px;max-height:calc(100% - var(--top,72px) - 24px);display:flex;flex-direction:column;z-index:5}
.timer{font-family:Brain,Outfit,sans-serif;font-weight:400;color:var(--navy);font-size:40px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;padding:0 4px}
.timer small{font-family:Outfit,sans-serif;font-size:16px;color:var(--muted);font-weight:600}
#raceStatus{font-size:13px;color:var(--muted);padding:4px 4px 8px;border-bottom:1px solid var(--line)}
#board{list-style:none;margin:6px 0 0;padding:0;overflow:auto}
#board li{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:10px;cursor:pointer;font-size:14px;transition:background .15s}
#board li:hover{background:rgba(243,114,101,.08)}
#board li.follow{background:rgba(243,114,101,.16)}
#board li.out,#board li.stuck{opacity:.55}
.pos{width:22px;font-weight:800;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
li.p1 .pos{color:#e0a800}li.p2 .pos{color:#8d99ae}li.p3 .pos{color:#cd7f32}
.dot{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset -2px -3px 4px rgba(0,0,0,.28),inset 2px 2px 3px rgba(255,255,255,.65)}
.nm{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:13px;padding:10px 6px;line-height:1.5}
.panel-foot{display:flex;gap:4px;padding-top:8px;border-top:1px solid var(--line);margin-top:6px;flex-wrap:wrap}
.panel-foot button.b{height:30px;font-size:12.5px;padding:0 8px}

/* context bar */
#ctxbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);padding:5px 8px;display:flex;gap:4px;align-items:center;z-index:6;max-width:calc(100% - 540px);flex-wrap:wrap;justify-content:center}
#ctxbar .tag{font-size:14px;padding:0 8px;white-space:nowrap}
#ctxbar .lvl{font-size:13px;color:var(--muted);padding:0 6px;white-space:nowrap}
#ctxbar .lvl b{color:var(--ink);font-size:15px}
.hintsm{font-size:12.5px;color:var(--muted);padding:0 8px}
.sw{display:flex;gap:4px;padding:0 6px}
.sw i{width:18px;height:18px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08);transition:transform .1s}
.sw i:hover{transform:scale(1.15)}
.sw i.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.warn{color:var(--bad);font-weight:600;font-size:12.5px;padding:0 6px}

/* overlays */
#countdown{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:20}
#countdown span{font-family:Brain,Outfit,sans-serif;font-weight:400;font-size:190px;color:var(--coral);text-shadow:0 10px 50px rgba(35,47,92,.35);-webkit-text-stroke:4px #fff;paint-order:stroke fill}
.pop{animation:pop .95s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.08);opacity:1}70%{opacity:1}100%{transform:scale(1);opacity:0}}
#toast{position:fixed;top:calc(var(--top,72px) + 6px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:30;pointer-events:none}
#toast div{background:rgba(35,41,70,.9);color:#fff;padding:8px 16px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow);animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#followTag{position:fixed;top:calc(var(--top,72px) + 6px);left:50%;transform:translateX(-50%);padding:7px 14px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;z-index:6}
#stats{position:fixed;right:14px;bottom:12px;font-size:11.5px;color:rgba(35,41,70,.55);z-index:4;font-variant-numeric:tabular-nums}
#modal{position:fixed;inset:0;background:rgba(30,30,70,.28);display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
.mcard{width:min(480px,92vw);padding:20px 22px;max-height:84vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(35,41,70,.3);animation:tin .2s ease-out}
.mcard h2{margin:0 0 12px;font-family:Brain,Outfit,sans-serif;font-weight:400;letter-spacing:.03em;font-size:26px;color:var(--navy)}
.mcard p{color:var(--muted);font-size:14px;line-height:1.5;margin:6px 0}
.mcard input[type=text]{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;outline:none}
.mcard input[type=text]:focus{border-color:var(--accent)}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.mrow button.b{background:#f1f2f8}
.list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.list .it{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:12px}
.list .it .nm{font-size:15px}
.list .it .meta{font-size:12px;color:var(--muted)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-top:6px}
kbd{display:inline-block;background:#f1f2f8;border:1px solid #dfe1ee;border-bottom-width:2px;border-radius:6px;padding:1px 7px;font:600 12.5px Outfit,system-ui,sans-serif;color:var(--ink)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:14px 0 6px}
.podium div{width:110px;border-radius:12px 12px 4px 4px;text-align:center;padding:10px 6px;color:#fff;font-weight:700}
.podium .dot{width:34px;height:34px;margin:0 auto 6px}
.podium small{display:block;font-weight:500;opacity:.9;font-size:12px}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#fff;z-index:100;font-weight:700;font-size:18px;color:var(--ink)}
#loading img{width:min(340px,70vw);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
@keyframes spin{to{transform:rotate(360deg)}}
body.drop #app canvas{cursor:crosshair}
body.placing #app canvas{cursor:copy}
@media (max-width:1100px){#racePanel{width:210px}#palette{width:180px}#ctxbar{max-width:calc(100% - 420px)}.speed input{width:70px}}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

}}
</script>
</head>
<body>
<div id="app"></div>

<header id="topbar">
  <div class="brand panel"><img src="assets/brainmaze-logo.png" alt="The Brain Maze"><div class="title">MARBLE <span>RACE</span></div><small id="trackName"></small></div>
  <div class="bar panel">
    <button class="b primary" id="btnRace" title="Start a race (Space)"></button>
    <button class="b icon" id="btnPause" title="Pause / resume (P)"></button>
    <button class="b icon" id="btnReset" title="Reset race, remove marbles (Backspace with nothing selected)"></button>
    <div class="sep"></div>
    <div class="stepper" title="Number of racing marbles">
      <button class="b icon" id="mMinus">−</button><span id="mCount">8</span><button class="b icon" id="mPlus">+</button><label>marbles</label>
    </div>
    <div class="sep"></div>
    <div class="speed">Speed <input type="range" id="speed" min="0.1" max="3" step="0.05" value="1"><b id="speedVal">1.0×</b></div>
    <button class="b" id="btnSlow" title="Slow motion (T)"></button>
    <button class="b icon" id="btnDrop" title="Drop marble tool: click on the track to drop a marble (M drops at cursor)"></button>
  </div>
  <div class="bar panel">
    <div class="seg">
      <button class="b on" data-cam="orbit" title="Free orbit camera (O)">Orbit</button>
      <button class="b" data-cam="follow" title="Follow a marble (F)">Follow</button>
      <button class="b" data-cam="cinematic" title="Cinematic auto-director (C)">Cinematic</button>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="bar panel">
    <button class="b icon" id="btnUndo" title="Undo (Ctrl+Z)"></button>
    <button class="b icon" id="btnRedo" title="Redo (Ctrl+Y)"></button>
    <div class="sep"></div>
    <button class="b icon" id="btnNew" title="New empty track"></button>
    <button class="b icon" id="btnSave" title="Save track (Ctrl+S)"></button>
    <button class="b icon" id="btnLoad" title="Load track"></button>
    <button class="b icon" id="btnExport" title="Export track as a .json file"></button>
    <button class="b icon" id="btnImport" title="Import a track .json file"></button>
    <div class="sep"></div>
    <button class="b icon" id="btnFrame" title="Frame the whole track (H)"></button>
    <button class="b icon" id="btnTrails" title="Toggle marble trails"></button>
    <button class="b icon" id="btnSound" title="Toggle sound"></button>
    <button class="b icon" id="btnHelp" title="Help & shortcuts (?)"></button>
  </div>
</header>

<aside id="palette" class="panel"></aside>

<aside id="racePanel" class="panel">
  <div class="timer" id="timer">0.00<small>s</small></div>
  <div id="raceStatus">Build a track, then press Race</div>
  <ol id="board"></ol>
</aside>

<div id="ctxbar" class="panel"></div>
<div id="followTag" class="panel hidden"></div>
<div id="countdown"></div>
<div id="toast"></div>
<div id="stats"></div>
<div id="modal" class="hidden"><div class="mcard" id="mcard"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hidden">
<div id="loading"><img src="assets/brainmaze-logo.png" alt="The Brain Maze"><div id="loadMsg">Warming up the marbles…</div></div>

<script>
  window.addEventListener('error', e => {
    const m = document.getElementById('loadMsg');
    if (m && document.getElementById('loading').style.display !== 'none')
      m.textContent = 'Could not start: ' + (e.message || 'failed to load libraries (check your internet connection)');
  });
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import RAPIER from 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js';

/* =====================================================================
   Constants & small helpers
   ===================================================================== */
const $ = s => document.querySelector(s);
const V3 = THREE.Vector3;
const Y = new V3(0, 1, 0);
const CELL = 4;          // grid cell size (world units)
const LH = 1;            // height of one level
const BASE = 0.6;        // level 0 floor height above the ground
const MR = 0.3;          // marble radius
const GRAV = -24;
const MAXL = 60;
const MAX_RACERS = 20, MAX_MARBLES = 80;
const HW = 0.8, RAD = 0.8, WALL = 0.95, THK = 0.1; // track profile
const TAU = Math.PI * 2;
const smooth = t => t * t * (3 - 2 * t);
// Drop profile 0→1 with flat ends: a long, gentle convex crest (so fast marbles stay on the
// track instead of flying off and crashing) followed by a short concave run-out.
const ease = u => u <= 0.75 ? u * u / 0.75 : 0.75 + 2 * (u - 0.75) - (u - 0.75) ** 2 / 0.25;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const DIRS = [[0, 1], [1, 0], [0, -1], [-1, 0]]; // heading index -> (x, z)
const herm = (t, y0, m0, y1, m1, L) => {
  const t2 = t * t, t3 = t2 * t;
  return (2 * t3 - 3 * t2 + 1) * y0 + (t3 - 2 * t2 + t) * L * m0 + (-2 * t3 + 3 * t2) * y1 + (t3 - t2) * L * m1;
};
const quatY = a => new THREE.Quaternion().setFromAxisAngle(Y, a);

const MARBLE_SET = [
  ['Ruby', '#e63946'], ['Sky', '#3a86ff'], ['Sunny', '#ffd23f'], ['Jade', '#2ec4b6'], ['Violet', '#8338ec'],
  ['Tangerine', '#ff8c42'], ['Bubblegum', '#ff5d8f'], ['Lime', '#8ac926'], ['Onyx', '#2b2d42'], ['Pearl', '#f1f1f6'],
  ['Cobalt', '#1d4ed8'], ['Coral', '#ff7f6e'], ['Mint', '#7dffcf'], ['Bronze', '#cd7f32'], ['Plum', '#7b2d8b'],
  ['Teal', '#118ab2'], ['Rose', '#ffafcc'], ['Olive', '#6a994e'], ['Cherry', '#9d0208'], ['Ice', '#a2d2ff'],
];
const TRACK_COLORS = ['#ff6b6b', '#ff922b', '#ffd43b', '#94d82d', '#38d9a9', '#22b8cf', '#4dabf7', '#748ffc', '#9775fa', '#da77f2', '#f783ac', '#f1f3f5', '#495057'];

const ICON = {
  play: '<path d="M7 4v16l13-8z" fill="currentColor"/>',
  pause: '<path d="M8 5v14M16 5v14"/>',
  reset: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
  redo: '<path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/>',
  save: '<path d="M5 3h11l5 5v13H3V3z"/><path d="M7 3v5h8"/><path d="M7 21v-7h10v7"/>',
  folder: '<path d="M3 6h6l2 2h10v12H3z"/>',
  download: '<path d="M12 3v12m-5-5 5 5 5-5"/><path d="M4 21h16"/>',
  upload: '<path d="M12 17V5m-5 5 5-5 5 5"/><path d="M4 21h16"/>',
  file: '<path d="M6 2h9l5 5v15H6z"/><path d="M12 11v6M9 14h6"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 1-1 1.7"/><path d="M12 17h.01"/>',
  sound: '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',
  mute: '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6m0-6-5 6"/>',
  rotate: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  up: '<path d="m6 15 6-6 6 6"/>', down: '<path d="m6 9 6 6 6-6"/>',

  trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/>',
  frame: '<path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5"/><circle cx="12" cy="12" r="3"/>',
  drop: '<circle cx="12" cy="15" r="5"/><path d="M12 2v6m-3-3 3 3 3-3"/>',
  slow: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',
  sparkle: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z"/>',
  magnet: '<path d="M6 3v8a6 6 0 0 0 12 0V3"/><path d="M6 7h4M14 7h4"/>',
  cam: '<path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
};
const ic = n => `<svg class="i" viewBox="0 0 24 24">${ICON[n]}</svg>`;

/* =====================================================================
   Textures

function buildCaches() {
  for (const [type, def] of Object.entries(PIECES)) {
    const o = def.build();
    const box = new THREE.Box3();
    for (const part of o.parts) { part.geo.computeBoundingBox(); box.union(part.geo.boundingBox); }
    for (const k of o.kin) for (const part of k.parts) { part.geo.computeBoundingBox(); const b = part.geo.boundingBox.clone(); b.translate(new V3(...k.p)); box.union(b); }
    o.ymin = box.min.y; o.ymax = box.max.y;
    def.cache = o; def.type = type;
  }
}

let world;
function initPhysics() {
  world = new RAPIER.World({ x: 0, y: GRAV, z: 0 });
  const gb = world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(0, -0.5, 0));
  world.createCollider(RAPIER.ColliderDesc.cuboid(700, 0.5, 700).setFriction(0.9).setRestitution(0.2), gb);
}
function colliderDesc(c) {
  let d;
  if (c.kind === 'tri') d = c.fix && RAPIER.TriMeshFlags
    ? RAPIER.ColliderDesc.trimesh(c.v, c.i, RAPIER.TriMeshFlags.FIX_INTERNAL_EDGES | RAPIER.TriMeshFlags.DELETE_DEGENERATE_TRIANGLES)
    : RAPIER.ColliderDesc.trimesh(c.v, c.i);
  else if (c.kind === 'box') { d = RAPIER.ColliderDesc.cuboid(c.h[0], c.h[1], c.h[2]).setTranslation(c.p[0], c.p[1], c.p[2]); d.setRotation({ x: c.q[0], y: c.q[1], z: c.q[2], w: c.q[3] }); }
  else d = RAPIER.ColliderDesc.cylinder(c.hh, c.r).setTranslation(c.p[0], c.p[1], c.p[2]);
  return d.setFriction(c.fr ?? 0.45).setRestitution(c.re ?? 0.2);
}

   Track state
   ===================================================================== */
const track = { pieces: [], name: 'My Track' };
let pid = 0;
let cellMap = new Map(), openExits = [], openEntries = [], finishList = [];

function pieceXf(spec) {
  return { pos: new V3(spec.gx * CELL, spec.level * LH + BASE, spec.gz * CELL), quat: quatY(spec.rot * Math.PI / 2) };
}
function rotCell([x, z], r) { for (let i = 0; i < r; i++) [x, z] = [z, -x]; return [x, z]; }
function worldCells(spec) { return PIECES[spec.type].cells.map(c => { const [x, z] = rotCell(c, spec.rot); return [spec.gx + x, spec.gz + z]; }); }
function specOf(p) { return { type: p.type, gx: p.gx, gz: p.gz, level: p.level, rot: p.rot, color: p.color }; }
function connectorsOf(spec) {
  const def = PIECES[spec.type], { pos, quat } = pieceXf(spec);
  return {
    entry: def.noEntry ? null : { pos: new V3(0, 0, -2).applyQuaternion(quat).add(pos), dir: spec.rot },
    exits: def.exits.map(e => ({ pos: new V3(...e.p).applyQuaternion(quat).add(pos), dir: (e.d + spec.rot) % 4 })),
  };
}
const ckey = c => `${Math.round(c.pos.x * 4)},${Math.round(c.pos.y * 4)},${Math.round(c.pos.z * 4)}|${c.dir}`;
function yRange(spec) { const c = PIECES[spec.type].cache, y = spec.level * LH + BASE; return [y + c.ymin, y + c.ymax]; }

function placeProblem(spec, ignore) {
  if (spec.level < 0 || spec.level > MAXL) return 'Height out of range';
  const yr = yRange(spec);
  if (yr[0] < -0.15) return 'Too low – raise it (E)';
  for (const [cx, cz] of worldCells(spec)) {
    const arr = cellMap.get(cx + ',' + cz);
    if (arr) for (const q of arr) if (q !== ignore && yr[0] < q.yr[1] - 0.12 && q.yr[0] < yr[1] - 0.12) return 'Overlaps another piece';
  }
  return null;
}

function makeVisual(type, color, override) {
  const c = PIECES[type].cache, group = new THREE.Group(), main = [];
  const mk = part => {
    const m = new THREE.Mesh(part.geo, override || matFor(part.mat, color));
    m.castShadow = !override && part.mat !== 'glass'; m.receiveShadow = !override;
    if (part.mat === 'track') main.push(m);
    return m;
  };
  for (const part of c.parts) group.add(mk(part));
  const kinObjs = c.kin.map(k => { const g = new THREE.Group(); g.position.set(...k.p); for (const part of k.parts) g.add(mk(part)); group.add(g); return g; });
  return { group, main, kinObjs };
}

function addPiece(spec, silent) {

function onTrackChanged(skipSave) {
  cellMap = new Map();
  const entryMap = new Map(), exitKeys = new Set();
  for (const p of track.pieces) {
    p.conn = connectorsOf(p); p.yr = yRange(p); p.chain = -1;
    for (const [cx, cz] of worldCells(p)) { const k = cx + ',' + cz; if (!cellMap.has(k)) cellMap.set(k, []); cellMap.get(k).push(p); }
    if (p.conn.entry) entryMap.set(ckey(p.conn.entry), p);
    for (const e of p.conn.exits) exitKeys.add(ckey(e));
  }
  openExits = []; openEntries = [];
  for (const p of track.pieces) {
    for (const e of p.conn.exits) if (!entryMap.has(ckey(e))) openExits.push(e);
    if (p.conn.entry && !exitKeys.has(ckey(p.conn.entry))) openEntries.push(p.conn.entry);
  }
  // chain order from start gates (used for live standings)
  const queue = track.pieces.filter(p => p.type === 'start'); queue.forEach(p => p.chain = 0);
  while (queue.length) {
    const p = queue.shift();
    for (const e of p.conn.exits) { const n = entryMap.get(ckey(e)); if (n && n.chain < 0) { n.chain = p.chain + 1; queue.push(n); } }
  }

  rebuildSupports(); rebuildMarkers();
  if (ui.selected) selBox.box.setFromObject(ui.selected.group);
  if (!skipSave) autosave();
  updateStats();
}

  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.random() * 6, Math.random() * 6, Math.random() * 6));
  const body = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(pos.x, pos.y, pos.z).setRotation(q).setCcdEnabled(true).setCanSleep(false).setLinearDamping(0.015).setAngularDamping(0.05));

function removeMarble(m) { scene.remove(m.mesh, m.line); m.line.geometry.dispose(); if (!m.retired) world.removeRigidBody(m.body); }

}

const leader = () => standings().find(live) || marbles.find(live) || null;

const race = { state: 'idle', time: 0, countdown: 0, order: [], gatesOpen: false };
let paused = false, simClock = 0;

  const wp = lp.applyQuaternion(p.quat).add(p.pos);

function setGates(open, immediate) {

}
function resetRace() {
  for (const m of marbles) removeMarble(m);

  race.state = 'idle'; race.time = 0; race.order = []; race.countdown = 0;
  setGates(false, true);
  $('#countdown').innerHTML = '';
  cam.shot = null; cam.target = null;
  updateBoard(true); updateRaceButtons();
}
function startRace() {
  const starts = track.pieces.filter(p => p.type === 'start');
  if (!starts.length) { toast('Add a Start Gate piece first'); flashCard('start'); return; }
  if (!finishList.length) toast('Tip: add a Finish Line so times get recorded');
  resetRace();

  const per = PIECES.start.cache.spawns.length;
  for (let j = 0; j < per; j++) for (const s of starts) spots.push(new V3(...PIECES.start.cache.spawns[j]).applyQuaternion(s.quat).add(s.pos));

/* =====================================================================
   Simulation stepping
   ===================================================================== */
let timeScale = 1, userSpeed = 1, slowmo = false, autoSlow = 0;
const tA = new V3(), tB = new V3(), tC = new V3();
function updateKinematics(h) {
  for (const p of track.pieces) for (const k of p.kins) {
    if (k.kind === 'spinner') {
      k.angle += h * 2.4;
      k.body.setNextKinematicRotation(quatY(p.rot * Math.PI / 2 + k.angle));
    } else if (k.kind === 'gate') {
      const target = race.gatesOpen ? 1 : 0;
      if (k.open !== target) {
        k.open = target > k.open ? Math.min(1, k.open + h * 4) : Math.max(0, k.open - h * 4);
        const lp = tC.copy(k.local); lp.y += k.open * 1.7; lp.applyQuaternion(p.quat).add(p.pos);

    for (const f of finishList) {

  for (let i = 0; i < n; i++) substep(simDt / n);
}
function raceChecks(simDt) {

   Camera director
   ===================================================================== */

// couple of seconds and ignored unless the course really turns, so spirals and wiggles don't
// swing the camera around; everything glides, nothing cuts.

  mode: 'orbit', target: null, dist: 11, look: new V3(), focus: new V3(), heading: new V3(),

  }

  const ft = $('#followTag');
  const fm = cam.mode === 'follow' ? cam.target : cam.mode === 'cinematic' && cam.shot ? cam.shot.m : null;
  if (fm && live(fm)) { ft.classList.remove('hidden'); ft.innerHTML = `${ic('cam')}<span class="dot" style="background:${fm.color}"></span>${fm.name}${cam.mode === 'cinematic' ? ' · cinematic' : ''}`; }
  else ft.classList.add('hidden');
}
$('#board').addEventListener('click', e => { const li = e.target.closest('li'); if (!li) return; const m = marbles.find(x => x.id === +li.dataset.id); if (m) setCamMode('follow', m); });

let fpsAcc = 0, fpsN = 0, fps = 60;
function updateStats() { $('#stats').textContent = `${track.pieces.length} pieces · ${marbles.length} marbles · ${fps} fps`; }

/* modals */
function openModal(html) { $('#mcard').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); }
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function openSave() {
  openModal(`<h2>Save track</h2><p>Saved in this browser. Use Export to get a file you can share.</p>
    <input type="text" id="saveName" maxlength="60" value="${esc(track.name)}">
    <div class="mrow"><button class="b" data-m="cancel">Cancel</button><button class="b primary" data-m="save">${ic('save')}Save</button></div>`);
  const inp = $('#saveName'); inp.focus(); inp.select();
  const doSave = () => {
    const name = inp.value.trim() || 'Untitled'; track.name = name; $('#trackName').textContent = '· ' + name;
    const all = LS.get('mrc.tracks', {}); all[name] = { data: serialize(), at: Date.now(), n: track.pieces.length }; LS.set('mrc.tracks', all);
    autosave(); closeModal(); toast(`Saved “${name}”`); sfx('ui');
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') doSave(); });
  $('#mcard').onclick = e => { const a = e.target.closest('[data-m]')?.dataset.m; if (a === 'save') doSave(); if (a === 'cancel') closeModal(); };
}
function openLoad() {
  const all = LS.get('mrc.tracks', {});
  const names = Object.keys(all).sort((a, b) => all[b].at - all[a].at);
  openModal(`<h2>Load track</h2>
    <div class="list">
      <div class="it"><span class="nm">⭐ Grand Descent <span class="meta">built-in demo</span></span><button class="b" data-m="demo">Load</button></div>
      ${names.map(n => `<div class="it"><span class="nm">${esc(n)}<br><span class="meta">${all[n].n} pieces · ${new Date(all[n].at).toLocaleString()}</span></span>
        <button class="b" data-m="load" data-n="${esc(n)}">Load</button><button class="b icon" data-m="del" data-n="${esc(n)}" title="Delete">${ic('trash')}</button></div>`).join('')}
      ${names.length ? '' : '<p>No saved tracks yet. Use Save to keep your creations.</p>'}
    </div>
    <div class="mrow"><button class="b" data-m="cancel">Close</button></div>`);
  $('#mcard').onclick = e => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    const a = b.dataset.m, n = b.dataset.n;
    if (a === 'cancel') closeModal();
    if (a === 'demo') { pushUndo(); resetRace(); loadData(demoTrack()); closeModal(); frameTrack(); toast('Loaded demo track'); }
    if (a === 'load' && all[n]) { pushUndo(); resetRace(); loadData(all[n].data); track.name = n; $('#trackName').textContent = '· ' + n; closeModal(); frameTrack(); toast(`Loaded “${n}”`); }
    if (a === 'del') { delete all[n]; LS.set('mrc.tracks', all); openLoad(); }
  };
}
function openNew() {
  openModal(`<h2>New track?</h2><p>This clears the current track. You can still undo it with Ctrl+Z.</p>
    <div class="mrow"><button class="b" data-m="cancel">Cancel</button><button class="b primary" data-m="ok">Clear track</button></div>`);
  $('#mcard').onclick = e => {
    const a = e.target.closest('[data-m]')?.dataset.m;
    if (a === 'cancel') closeModal();
    if (a === 'ok') { pushUndo(); resetRace(); clearTrack(); track.name = 'My Track'; $('#trackName').textContent = '· My Track'; closeModal(); frameTrack(); }
  };
}
function exportTrack() {
  const blob = new Blob([JSON.stringify(serialize(), null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = (track.name || 'track').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') + '.marbletrack.json';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const data = JSON.parse(await f.text()); pushUndo(); resetRace(); loadData(data); frameTrack(); toast(`Imported “${track.name}”`); }
  catch (err) { toast('Could not read that file: ' + err.message); }
});
function openHelp() {
  const row = (k, d) => `<div>${k}</div><div>${d}</div>`;
  openModal(`<h2>How to play</h2>
    <p>Drag pieces from the left onto the ground, or click a piece and then click to place it. Pieces snap to open track ends (green arrows). Connect a <b>Start Gate</b> to a <b>Finish Line</b>, then press <b>Race</b>.</p>
    <div class="keys">
      ${row('<kbd>Left drag</kbd>', 'Orbit camera')}${row('<kbd>Right drag</kbd> / <kbd>WASD</kbd>', 'Pan camera')}${row('<kbd>Wheel</kbd>', 'Zoom (follow distance in Follow mode)')}
      ${row('<kbd>R</kbd> / <kbd>Shift R</kbd>', 'Rotate piece')}${row('<kbd>E</kbd> / <kbd>Q</kbd>, <kbd>Shift</kbd>+wheel', 'Raise / lower piece')}
      ${row('<kbd>Alt</kbd> (hold)', 'Place without snapping')}${row('Drag selected piece', 'Move it')}
      ${row('<kbd>Ctrl D</kbd> / <kbd>Del</kbd>', 'Duplicate / delete')}${row('<kbd>Ctrl Z</kbd> / <kbd>Ctrl Y</kbd>', 'Undo / redo')}
      ${row('<kbd>Space</kbd>', 'Race / pause')}${row('<kbd>T</kbd>', 'Slow motion')}${row('<kbd>M</kbd>', 'Drop a marble at the cursor')}
      ${row('<kbd>F</kbd> / <kbd>1</kbd>–<kbd>9</kbd>', 'Follow leader / follow position N')}${row('<kbd>C</kbd> / <kbd>O</kbd>', 'Cinematic / orbit camera')}
      ${row('<kbd>H</kbd>', 'Frame the whole track')}${row('<kbd>Esc</kbd>', 'Stop placing / deselect')}
    </div>
    <p>Tips: loops need a run-up of about 4 levels of drop. Peg boards and spinners shuffle the order. Everything autosaves in this browser.</p>
    <div class="mrow"><button class="b primary" data-m="cancel">Let's build!</button></div>`);
  $('#mcard').onclick = e => { if (e.target.closest('[data-m]')) closeModal(); };
}
function showResults() {
  const o = race.order, cols = ['#f5b301', '#9aa5b8', '#cd7f32'];
  const pod = [1, 0, 2].filter(i => o[i]).map(i => `<div style="background:${cols[i]};height:${[120, 95, 80][i]}px"><span class="dot" style="background:${o[i].color}"></span>${i + 1}. ${esc(o[i].name)}<small>${o[i].time.toFixed(2)}s</small></div>`).join('');
  const rest = standings().slice(3).map((m, i) => `<div class="it"><span class="pos">${i + 4}</span><span class="dot" style="background:${m.color}"></span><span class="nm">${m.name}</span><span class="tm">${m.status === 'finished' ? m.time.toFixed(2) + 's' : m.status === 'out' ? 'DNF' : 'Stuck'}</span></div>`).join('');
  openModal(`<h2>🏁 Race results</h2><div class="podium">${pod}</div><div class="list">${rest}</div>
    <div class="mrow"><button class="b" data-m="cancel">Close</button><button class="b primary" data-m="again">${ic('play')}Race again</button></div>`);
  $('#mcard').onclick = e => { const a = e.target.closest('[data-m]')?.dataset.m; if (a) closeModal(); if (a === 'again') startRace(); };
}

/* top bar */
function wireTopbar() {
  $('#btnReset').innerHTML = ic('reset'); $('#btnUndo').innerHTML = ic('undo'); $('#btnRedo').innerHTML = ic('redo');
  $('#btnNew').innerHTML = ic('file'); $('#btnSave').innerHTML = ic('save'); $('#btnLoad').innerHTML = ic('folder');
  $('#btnExport').innerHTML = ic('download'); $('#btnImport').innerHTML = ic('upload'); $('#btnHelp').innerHTML = ic('help');
  $('#btnFrame').innerHTML = ic('frame'); $('#btnTrails').innerHTML = ic('sparkle'); $('#btnSlow').innerHTML = ic('slow') + 'Slow-mo';
  $('#btnDrop').innerHTML = ic('drop');
  const soundIcon = () => { $('#btnSound').innerHTML = ic(settings.sound ? 'sound' : 'mute'); };
  soundIcon(); $('#btnTrails').classList.toggle('on', settings.trails);
  $('#mCount').textContent = settings.count;
  $('#btnRace').onclick = startRace; $('#btnPause').onclick = togglePause; $('#btnReset').onclick = resetRace;
  $('#btnSlow').onclick = toggleSlow; $('#btnDrop').onclick = () => setDropMode(ui.mode !== 'drop');
  $('#mMinus').onclick = () => { settings.count = Math.max(1, settings.count - 1); $('#mCount').textContent = settings.count; saveSettings(); };
  $('#mPlus').onclick = () => { settings.count = Math.min(MAX_RACERS, settings.count + 1); $('#mCount').textContent = settings.count; saveSettings(); };
  $('#speed').oninput = e => { userSpeed = +e.target.value; $('#speedVal').textContent = userSpeed.toFixed(1) + '×'; };
  document.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => setCamMode(b.dataset.cam));
  $('#btnUndo').onclick = undo; $('#btnRedo').onclick = redo; $('#btnNew').onclick = openNew;
  $('#btnSave').onclick = openSave; $('#btnLoad').onclick = openLoad; $('#btnExport').onclick = exportTrack;
  $('#btnImport').onclick = () => $('#fileIn').click(); $('#btnHelp').onclick = openHelp; $('#btnFrame').onclick = frameTrack;
  $('#btnTrails').onclick = () => { settings.trails = !settings.trails; marbles.forEach(m => m.line.visible = settings.trails); $('#btnTrails').classList.toggle('on', settings.trails); saveSettings(); };
  $('#btnSound').onclick = () => { settings.sound = !settings.sound; soundIcon(); saveSettings(); };
  updateRaceButtons();
}

/* palette with rendered thumbnails */
function buildPalette() {
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.setSize(150, 150); r.setPixelRatio(1); r.toneMapping = THREE.ACESFilmicToneMapping;
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight('#ffffff', '#b8b0d0', 2.4));
  const dl = new THREE.DirectionalLight('#ffffff', 2.6); dl.position.set(4, 7, -3); sc.add(dl);
  const c = new THREE.PerspectiveCamera(32, 1, 0.1, 200);
  const thumbs = {};
  for (const type of Object.keys(PIECES)) {
    const v = makeVisual(type, PIECES[type].color); sc.add(v.group);
    const box = new THREE.Box3().setFromObject(v.group), ctr = box.getCenter(new V3()), size = box.getSize(new V3()).length();
    c.position.copy(ctr).addScaledVector(new V3(1.15, 1.0, -0.9).normalize(), size * 1.5); c.lookAt(ctr);
    r.render(sc, c); thumbs[type] = r.domElement.toDataURL();
    sc.remove(v.group);
  }
  r.dispose(); r.forceContextLoss();
  const pal = $('#palette');
  pal.innerHTML = CATS.map(cat => `<div class="cat"><h4>${cat}</h4><div class="cards">${Object.entries(PIECES).filter(([, d]) => d.cat === cat)
    .map(([t, d]) => `<div class="card" data-t="${t}" title="${esc(d.name)} — ${esc(d.desc)}"><img src="${thumbs[t]}" alt=""><span>${d.name}</span></div>`).join('')}</div></div>`).join('')
    + `<div class="pal-foot">Drag a piece into the scene, or click it and click to place. <b>R</b> rotates, <b>Q/E</b> change height.</div>`;
  pal.querySelectorAll('.card').forEach(card => card.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    if (ui.mode === 'place' && ui.placeType === card.dataset.t && !ui.fromPalette) { exitPlace(); return; }
    if (ui.mode === 'drop') setDropMode(false);
    ptr.bx = e.clientX; ptr.by = e.clientY; ptr.moved = false;
    ui.fromPalette = true;
    enterPlace(card.dataset.t);
    sfx('ui');
  }));
}

/* sound */
let actx = null;
function sfx(type, n = 1) {
  if (!settings.sound) return;
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    const P = { tick: [660, 0.14, 'sine', 0.14], go: [990, 0.4, 'triangle', 0.18], place: [520, 0.08, 'sine', 0.1], remove: [240, 0.1, 'sine', 0.09],
      finish: [880 * Math.pow(2, -Math.min(n - 1, 8) / 12), 0.35, 'sine', 0.14], win: [784, 0.7, 'triangle', 0.16], ui: [460, 0.05, 'sine', 0.05] }[type];
    o.type = P[2]; o.frequency.setValueAtTime(P[0], t);
    if (type === 'place') o.frequency.exponentialRampToValueAtTime(820, t + 0.07);
    if (type === 'win') { o.frequency.setValueAtTime(784, t); o.frequency.setValueAtTime(988, t + 0.15); o.frequency.setValueAtTime(1175, t + 0.3); }
    g.gain.setValueAtTime(P[3], t); g.gain.exponentialRampToValueAtTime(0.0001, t + P[1]);
    o.start(t); o.stop(t + P[1] + 0.02);
  } catch { }
}

/* =====================================================================
   Main loop
   ===================================================================== */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const rawDt = Math.min((now - last) / 1000, 1 / 20); last = now;
  fpsAcc += rawDt; fpsN++;
  if (fpsAcc > 0.5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; updateStats(); }

  if (autoSlow > 0) autoSlow -= rawDt;
  let target = slowmo ? 0.25 : userSpeed;
  if (autoSlow > 0) target = Math.min(target, 0.3);
  timeScale += (target - timeScale) * (1 - Math.exp(-rawDt * 6));

  if (race.state === 'countdown' && !paused) {
    const before = Math.ceil(race.countdown); race.countdown -= rawDt; const after = Math.ceil(race.countdown);
    if (race.countdown <= 0) go(); else if (after !== before) { showCount(after); sfx('tick'); }
  }
  let simDt = 0;
  if (!paused) { simDt = rawDt * timeScale; stepSim(simDt); }

  for (const m of marbles) {
    if (m.retired) continue;
    const t = m.body.translation(), r = m.body.rotation();
    m.mesh.position.set(t.x, t.y, t.z); m.mesh.quaternion.set(r.x, r.y, r.z, r.w);
    if (settings.trails && !paused) {
      const tp = m.tp;
      if (!m.tn || Math.hypot(t.x - tp[0], t.y - tp[1], t.z - tp[2]) > 0.12) {
        tp.copyWithin(3, 0, (TRAIL_N - 1) * 3); tp[0] = t.x; tp[1] = t.y; tp[2] = t.z;
        m.tn = Math.min(m.tn + 1, TRAIL_N); m.line.geometry.setDrawRange(0, m.tn); m.line.geometry.attributes.position.needsUpdate = true;
      }
    }
  }
  raceChecks(simDt);
  for (const p of track.pieces) for (const k of p.kins) {
    if (k.kind === 'spinner') k.obj.rotation.y = k.angle; else k.obj.position.y = k.local.y + k.open * 1.7;
  }
  if (markerRoot.visible) markerRoot.children.forEach((m, i) => m.position.y = m.userData.base + Math.sin(now / 300 + i) * 0.08);
  if (clouds) clouds.rotation.y += rawDt * 0.004;

  updateCamera(rawDt);
  if (Math.abs(camera.fov - cam.fov) > 0.05) { camera.fov += (cam.fov - camera.fov) * (1 - Math.exp(-rawDt * 4)); camera.updateProjectionMatrix(); }
  const focus = cam.mode === 'orbit' ? controls.target : cam.look;
  sun.target.position.set(Math.round(focus.x / 4) * 4, 0, Math.round(focus.z / 4) * 4);
  sun.position.copy(sun.target.position).add(SUN_OFF);
  updateBoard();
  renderer.render(scene, camera);
}
// side panels start below the top bar, which can wrap onto two rows on narrow windows
const layoutPanels = () => document.documentElement.style.setProperty('--top', ($('#topbar').getBoundingClientRect().bottom + 10) + 'px');
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  layoutPanels();
});
layoutPanels();

/* =====================================================================
   Boot
   ===================================================================== */
// the START/FINISH banners are drawn on canvases, so the Brain font must be ready first
await Promise.race([document.fonts.load('76px Brain').catch(() => { }), new Promise(r => setTimeout(r, 2500))]);
await RAPIER.init();
initPhysics();
buildCaches();
buildDecor();
buildPalette();
wireTopbar();
layoutPanels(); document.fonts?.ready.then(layoutPanels);
markerRoot.visible = false;
try {
  const saved = LS.get('mrc.autosave', null);
  loadData(saved && saved.pieces && saved.pieces.length ? saved : demoTrack());
} catch (err) { console.error(err); loadData(demoTrack()); }
frameTrack();
renderCtx(); updateBoard(true);
$('#loading').style.display = 'none';
requestAnimationFrame(frame);
if (!LS.get('mrc.seenHelp', false)) { LS.set('mrc.seenHelp', true); setTimeout(openHelp, 400); }
// debug hook: advance the simulation without rendering (useful for testing tracks)
function simulate(sec) {
  if (race.state === 'countdown') { stepSim(1.5); go(); }
  for (let t = 0; t < sec; t += 1 / 60) {
    stepSim(1 / 60);
    for (const m of marbles) { if (m.retired) continue; const p = m.body.translation(); m.mesh.position.set(p.x, p.y, p.z); }
    raceChecks(1 / 60);
  }
}
// debug hook: roll one marble from the entry of the piece at chain index `chain`; reports speed at each piece
function probe(chain, speed = 1, dur = 30) {
  resetRace();
  const p = track.pieces.find(q => q.chain === chain);
  if (!p || !p.conn.entry) return 'no such piece';
  const e = p.conn.entry, d = DIRS[e.dir];
  const m = spawnMarble(0, e.pos.clone().add(new V3(d[0] * 0.15, 0.31, d[1] * 0.15)));
  m.body.setLinvel({ x: d[0] * speed, y: 0, z: d[1] * speed }, true);
  m.body.setAngvel({ x: d[1] * speed / MR, y: 0, z: -d[0] * speed / MR }, true);
  m.lastChain = chain; race.state = 'running';
  const rec = []; let last = -1;
  for (let t = 0; t < dur && !m.done; t += 0.05) {
    simulate(0.05); progressOf(m);
    if (m.lastChain !== last) { const v = m.body.linvel(); rec.push(`${m.lastChain}:${track.pieces.find(q => q.chain === m.lastChain)?.type}@${Math.hypot(v.x, v.y, v.z).toFixed(1)}`); last = m.lastChain; }
  }
  const r = rec.join(' ') + ' → ' + m.status + (m.status === 'finished' ? ' ' + m.time.toFixed(2) + 's' : '');
  resetRace();
  return r;
}
// e.g. __mrc.startRace(); __mrc.simulate(30); __mrc.standings()   or   __mrc.probe(1)
window.__mrc = { track, marbles: () => marbles, race, startRace, resetRace, standings, simulate, probe, camera };
</script>
